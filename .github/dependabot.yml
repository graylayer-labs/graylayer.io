version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @astrojs/check 0.9.x accepts only typescript ^5 || ^6; revisit when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep the types on the Node major that CI runs (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
